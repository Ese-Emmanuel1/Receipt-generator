<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Initiate Transfer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            text-align: center;
        }

        .logo-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0070ba 0%, #1abc9c 100%);
            border-radius: 50%;
            color: #ffffff;
            font-weight: 700;
            font-size: 24px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1d1d1f;
            font-weight: 700;
        }

        .subtitle {
            font-size: 15px;
            color: #6b6f76;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1d1d1f;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e1e5e9;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0070ba;
            box-shadow: 0 0 0 3px rgba(0, 112, 186, 0.1);
        }

        .currency-input {
            position: relative;
        }

        .currency-symbol {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 500;
            color: #1d1d1f;
        }

        .currency-input input {
            padding-left: 32px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 35px;
        }

        .primary-btn,
        .secondary-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .primary-btn {
            background: #0070ba;
            color: #ffffff;
        }

        .primary-btn:hover {
            background: #005ea6;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background: #f2f8fd;
            color: #0070ba;
            border: 1.5px solid #0070ba;
        }

        .secondary-btn:hover {
            background: #e8f2fc;
        }

        .error-message {
            display: none;
            color: #e53e3e;
            font-size: 13px;
            margin-top: 6px;
            font-weight: 500;
        }

        .input-error {
            border-color: #e53e3e !important;
        }

        .input-error:focus {
            border-color: #e53e3e !important;
            box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.1) !important;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0070ba;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            color: #1abc9c;
            font-size: 14px;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo-wrapper">PayPal</div>

    <h1>Send Money</h1>
    <p class="subtitle">Enter recipient details to initiate transfer</p>

    <form id="transferForm" novalidate>

        <div class="form-group">
            <label for="recipientEmail">Recipient Email</label>
            <input type="email" id="recipientEmail" placeholder="name@example.com">
            <div class="error-message" id="emailError">Please enter a valid email address</div>
        </div>

        <div class="form-group">
            <label for="amount">Amount</label>
            <div class="currency-input">
                <span class="currency-symbol">$</span>
                <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01">
            </div>
            <div class="error-message" id="amountError">Please enter a valid amount (minimum $0.01)</div>
        </div>

        <div class="success-message" id="successMessage">
            ✓ Transfer initiated successfully!
        </div>

        <div class="buttons-container">
            <button type="button" id="downloadPdfBtn" class="secondary-btn">
                Download as PDF
            </button>

            <button type="button" id="initiateTransferBtn" class="primary-btn">
                <span id="btnText">Initiate Transfer</span>
                <div class="loader" id="btnLoader"></div>
            </button>
        </div>

    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // DOM Elements
    const emailInput = document.getElementById("recipientEmail");
    const amountInput = document.getElementById("amount");
    const emailError = document.getElementById("emailError");
    const amountError = document.getElementById("amountError");
    const successMessage = document.getElementById("successMessage");
    const downloadBtn = document.getElementById("downloadPdfBtn");
    const transferBtn = document.getElementById("initiateTransferBtn");
    const btnText = document.getElementById("btnText");
    const btnLoader = document.getElementById("btnLoader");

    // Regular expression for email validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Validation functions
    function validEmail(value) {
        value = value.trim();
        return emailRegex.test(value);
    }

    function validAmount(value) {
        const amount = parseFloat(value);
        return !isNaN(amount) && amount > 0;
    }

    // Show error function
    function showError(inputElement, errorElement, message) {
        inputElement.classList.add('input-error');
        errorElement.textContent = message;
        errorElement.style.display = 'block';
        successMessage.style.display = 'none';
    }

    // Clear error function
    function clearError(inputElement, errorElement) {
        inputElement.classList.remove('input-error');
        errorElement.style.display = 'none';
    }

    // Real-time validation
    emailInput.addEventListener('input', function() {
        if (this.value.trim() === '') {
            clearError(emailInput, emailError);
        } else if (!validEmail(this.value)) {
            showError(emailInput, emailError, 'Please enter a valid email address');
        } else {
            clearError(emailInput, emailError);
        }
    });

    amountInput.addEventListener('input', function() {
        if (this.value.trim() === '') {
            clearError(amountInput, amountError);
        } else if (!validAmount(this.value)) {
            showError(amountInput, amountError, 'Please enter a valid amount (minimum $0.01)');
        } else {
            clearError(amountInput, amountError);
        }
    });

    // Main validation function
    function validateForm() {
        let isValid = true;
        
        // Validate email
        if (!validEmail(emailInput.value)) {
            showError(emailInput, emailError, 'Please enter a valid email address');
            isValid = false;
        } else {
            clearError(emailInput, emailError);
        }

        // Validate amount
        if (!validAmount(amountInput.value)) {
            showError(amountInput, amountError, 'Please enter a valid amount (minimum $0.01)');
            isValid = false;
        } else {
            clearError(amountInput, amountError);
        }

        return isValid;
    }

    // Format amount to 2 decimal places
    function formatAmount(amount) {
        const num = parseFloat(amount);
        return num.toFixed(2);
    }

    // Download PDF button handler
    downloadBtn.addEventListener("click", function () {
        if (!validateForm()) return;
        
        // Create PDF content (simulated)
        const email = emailInput.value.trim();
        const amount = formatAmount(amountInput.value);
        const date = new Date().toLocaleDateString();
        const time = new Date().toLocaleTimeString();
        
        const pdfContent = `
            TRANSFER RECEIPT
            ================
            Date: ${date}
            Time: ${time}
            
            Recipient: ${email}
            Amount: $${amount}
            
            Status: Pending
            Transaction ID: ${Math.random().toString(36).substr(2, 9).toUpperCase()}
            
            This is a simulated PDF receipt.
        `;
        
        // In a real application, you would generate an actual PDF here
        // For simulation, we'll just show an alert
        alert("PDF Receipt Generated:\n\n" + pdfContent);
        
        // Simulate download
        console.log("PDF content:", pdfContent);
        successMessage.textContent = "✓ PDF downloaded successfully!";
        successMessage.style.display = 'block';
    });

    // Initiate Transfer button handler
    transferBtn.addEventListener("click", function () {
        if (!validateForm()) return;
        
        // Show loading state
        btnText.style.display = 'none';
        btnLoader.style.display = 'block';
        transferBtn.disabled = true;
        downloadBtn.disabled = true;
        
        // Simulate API call delay
        setTimeout(function() {
            // Get and format values
            const email = encodeURIComponent(emailInput.value.trim());
            const amount = encodeURIComponent(formatAmount(amountInput.value));
            
            // Reset button state
            btnText.style.display = 'block';
            btnLoader.style.display = 'none';
            transferBtn.disabled = false;
            downloadBtn.disabled = false;
            
            // Show success message
            successMessage.textContent = "✓ Transfer initiated successfully! Redirecting...";
            successMessage.style.display = 'block';
            
            // Redirect to success page with data
            setTimeout(function() {
                window.location.href = `transfersuccessful.html?email=${email}&amount=${amount}`;
            }, 1500);
            
        }, 2000); // 2 second simulation delay
    });

    // Form submission prevention (if using form submit)
    document.getElementById('transferForm').addEventListener('submit', function(e) {
        e.preventDefault();
    });

    // Auto-focus email field on page load
    emailInput.focus();

    // Example data for testing (can be removed)
    function populateTestData() {
        // Uncomment to auto-fill test data for testing
        // emailInput.value = 'test@example.com';
        // amountInput.value = '250.50';
    }
    
    populateTestData();

});
</script>

</body>
</html>
